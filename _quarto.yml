project:
  type: website
  output-dir: _site
  resources:
    - data/public/clasificacion/*
    - output/pdf/guia-primer-clasificador-en-excel.pdf
    - output/pdf/guia-random-forest-en-excel.pdf
    - output/pdf/proyecto-final-instrucciones.pdf
    - output/excel/random-forest-auditable.xlsx
  render:
    - index.qmd
    - sesiones/*.qmd
    - fichas/*.qmd
    - slides/*.qmd
    - proyecto/*.qmd

