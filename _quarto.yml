            text: "Sesión 3 · Regresión simple"
          - href: sesiones/sesion-04.qmd
            text: "Sesión 4 · Regresión múltiple"
          - href: sesiones/sesion-05.qmd
            text: "Sesión 5 · Preparación y clasificación"
          - href: sesiones/sesion-06.qmd
            text: "Sesión 6 · Algoritmos y métricas"
          - href: sesiones/sesion-07.qmd
            text: "Sesión 7 · Validación y fuga"
          - href: sesiones/sesion-08.qmd
            text: "Sesión 8 · Del modelo a la decisión"
      - text: Diapositivas
        menu:
          - href: slides/sesion-03.qmd
            text: "Sesión 3 · Regresión simple"
          - href: slides/sesion-04.qmd
            text: "Sesión 4 · Regresión múltiple"
          - href: slides/sesion-05.qmd
            text: "Sesión 5 · Preparación y clasificación"
