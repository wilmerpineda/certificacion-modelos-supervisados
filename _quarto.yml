project:
  type: website
  output-dir: _site
  resources:
    - data/public/clasificacion/*
  render:
    - index.qmd
    - sesiones/*.qmd
    - fichas/*.qmd
    - slides/*.qmd

website:
  title: "Modelos Supervisados"
  favicon: assets/brand/logo-externado.png
  navbar:
    logo: assets/brand/logo-externado.png
    left:
      - href: index.qmd
        text: Inicio
      - text: Sesiones
        menu:
          - href: sesiones/sesion-03.qmd
            text: "Sesión 3 · Regresión simple"
          - href: sesiones/sesion-04.qmd
            text: "Sesión 4 · Regresión múltiple"
          - href: sesiones/sesion-05.qmd
            text: "Sesión 5 · Preparación y clasificación"
          - href: sesiones/sesion-06.qmd
            text: "Sesión 6 · Algoritmos y métricas"
      - text: Diapositivas
        menu:
          - href: slides/sesion-03.qmd
            text: "Sesión 3 · Regresión simple"
          - href: slides/sesion-04.qmd
            text: "Sesión 4 · Regresión múltiple"
          - href: slides/sesion-05.qmd
            text: "Sesión 5 · Preparación y clasificación"
          - href: slides/sesion-06.qmd
            text: "Sesión 6 · Algoritmos y métricas"
      - text: Fichas
        menu:
          - href: fichas/ficha-estudiante.qmd
            text: "Sesiones 3 y 4"
          - href: fichas/ficha-clasificacion.qmd
            text: "Sesiones 5 y 6"
  page-footer:
    left: "Universidad Externado de Colombia · Certificación en Ciencia de Datos"
    right: "Evidencia → interpretación → decisión"

format:
  html:
    theme: cosmo
    css: assets/styles/course.css
    toc: true
    lang: es

execute:
  freeze: auto
